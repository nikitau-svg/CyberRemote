name: CI

on:
  push:
  pull_request:

jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run protocol tests
        run: ./gradlew :protocol:test :cli:build

  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Record APK checksum
        working-directory: app/build/outputs/apk/release
        run: sha256sum *.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CyberRemote-QS-unsigned-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
