syntax = "proto2";
option java_package = "dev.companionremote.protocol.mrp.proto";
option java_multiple_files = true;


import "pyatv/protocols/mrp/protobuf/ProtocolMessage.proto";
import "pyatv/protocols/mrp/protobuf/PlayerPath.proto";

extend ProtocolMessage {
  optional SetNowPlayingPlayerMessage setNowPlayingPlayerMessage = 51;
}

message SetNowPlayingPlayerMessage {
  optional PlayerPath playerPath = 1;
}
