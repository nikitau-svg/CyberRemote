syntax = "proto2";
option java_package = "dev.companionremote.protocol.mrp.proto";
option java_multiple_files = true;


import "pyatv/protocols/mrp/protobuf/ProtocolMessage.proto";

extend ProtocolMessage {
  optional SetConnectionStateMessage setConnectionStateMessage = 42;
}

message SetConnectionStateMessage {
  enum ConnectionState {
    None = 0;
    Connecting = 1;
    Connected = 2;
    Disconnected = 3;
  }

  optional ConnectionState state = 1;
}
